name: drive-to-release

# Pobiera publiczne pliki z Google Drive i publikuje je jako zalaczniki wydania.
# Uruchamia sie po wgraniu pliku jobs/<nazwa>.txt z liniami: "<nazwa_pliku> <id_z_Drive>".
# Wydanie dostaje tag = <nazwa> z pliku jobs. Linki: https://github.com/<repo>/releases/download/<tag>/<nazwa_pliku>

on:
  push:
    branches: [main]
    paths: ['jobs/*.txt']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Pobierz pliki z Drive i opublikuj wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/*.txt' || true)
          for job in $changed; do
            tag=$(basename "$job" .txt)
            mkdir -p "out/$tag"
            while read -r name id; do
              [ -z "${name:-}" ] && continue
              case "$name" in \#*) continue;; esac
              # nazwa tylko z bezpiecznych znakow, id tylko z dozwolonych znakow Drive
              [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "zla nazwa: $name"; exit 1; }
              [[ "$id" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "zle id: $id"; exit 1; }
              curl -sSL --fail -o "out/$tag/$name" \
                "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
              type=$(file -b --mime-type "out/$tag/$name")
              echo "$name $type $(stat -c %s "out/$tag/$name")"
              case "$type" in image/*|video/*) ;; *) echo "nie obraz/film: $name ($type) - plik niepubliczny?"; exit 1;; esac
            done < "$job"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" out/"$tag"/* --title "$tag" --notes "Pliki tymczasowe do wgrania w Meta. Do usuniecia po publikacji."
          done
